name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    # Don't run on forks. We can and should only release from the main repo.
    permissions:
      contents: write # for Git to git push
      pull-requests: write # to allow creating PR
      id-token: write # for npm provenance

    if: github.repository == 'Ocean-Industries-Concept-Lab/lit'

    name: Release
    environment: Changesets
    runs-on: ubuntu-latest
    env:
      WIREIT_LOGGER: quiet-ci
    steps:
      # Short-lived installation token for the release GitHub App.
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Use the release bot's name and email for all git actions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout Lit Repo
        uses: actions/checkout@v7
        with:
          path: lit
          # This makes Actions fetch all Git history so that Changesets can
          # generate changelogs with the correct commits
          fetch-depth: 0
          # Push as the app too, so pushes to the "Version Packages" PR trigger
          # workflow runs.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.5
          cache: 'npm'
          cache-dependency-path: lit/package-lock.json

      # Note: trusted publishing (OIDC) requires npm >= 11.5.1. Node 24.5 bundles
      # exactly 11.5.1, so no upgrade step is needed. Don't add one that installs
      # npm@latest: npm 12 requires node ^22.22.2 || ^24.15.0 || >=26, which the
      # pinned Node 24.5 does not satisfy, and the install fails with EBADENGINE.
      - name: Install Dependencies
        working-directory: lit
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        # The id of this step must not be "changesets", or else the step will be invisible
        # in the list of steps from the GitHub UI when the action runs (though it will still
        # run, and its output will appear in the raw logs). Unknown why this is the case,
        # see https://github.com/changesets/action/issues/149 for discussion.
        id: cs
        # v1.5.2 broke `cwd` (https://github.com/changesets/action/issues/501);
        # fixed in v1.8.0. Stay on v1: v2 renames inputs and drops `cwd`.
        uses: changesets/action@v1.9.0
        with:
          # The `working-directory` option is only available for steps that use
          # `run`. This `cwd` option is the same, but specific to this action.
          cwd: lit
          # This prevents `changesets/action` from changing the git username and
          # email.
          setupGitUser: false
          version: npm run version
          publish: npm run release
        env:
          HUSKY: 0
          # The app token (not the default job token) so that the "Version
          # Packages" PR it opens can itself trigger workflow runs.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # No NPM_TOKEN: authentication happens via OIDC trusted publishing,
          # which relies on the `id-token: write` permission above. Provenance
          # is implied by trusted publishing, so NPM_CONFIG_PROVENANCE is unset.
