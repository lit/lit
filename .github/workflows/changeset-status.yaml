name: Changeset Status

on: [pull_request]

permissions:
  contents: read

jobs:
  # Enforce that all PRs that change packages need changesets. Changes
  # without changesets result in this job failing.
  changeset:
    runs-on: ubuntu-latest
    # Skip the release PR, which consumes changesets rather than adding one and
    # so can never satisfy this check. Match on the branch Changesets always
    # creates rather than on the PR author: the author is whoever owns the
    # token in RELEASE_PAT, not a fixed bot account.
    if: ${{ github.head_ref != 'changeset-release/main' }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 24.5
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Checkout and NPM install
        run: |
          git checkout main
          git checkout ${{ github.sha }}
          npm ci

      - name: Changeset status
        run: npm run changeset status -- --since=main
